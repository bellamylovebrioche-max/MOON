<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050817" />
  <title>Bella — To the Moon and Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #050817;
      --deep-night: #02030b;
      --mist: #dbe8ff;
      --soft: #a9b9d8;
      --gold: #f6d88b;
      --gold-bright: #fff1bc;
      --violet: #a99cff;
      --line: rgba(213, 226, 255, 0.34);
      --ease: cubic-bezier(.22, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      color: var(--mist);
      background:
        radial-gradient(ellipse at 82% 8%, rgba(77, 70, 153, .28) 0%, transparent 34%),
        radial-gradient(ellipse at 12% 88%, rgba(25, 65, 111, .23) 0%, transparent 36%),
        linear-gradient(145deg, var(--night), var(--deep-night));
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: .18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    #sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; }

    .star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: var(--star-color, #fff);
      opacity: var(--opacity);
      animation: shimmer var(--duration) ease-in-out infinite var(--delay);
      box-shadow: 0 0 7px var(--star-color, #fff);
    }

    @keyframes shimmer {
      0%, 100% { opacity: var(--opacity); transform: scale(1); }
      50% { opacity: calc(var(--opacity) * 2.2); transform: scale(1.45); }
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: .13;
      mix-blend-mode: screen;
    }
    .nebula.one { width: 40vw; height: 30vw; left: -9vw; bottom: -12vw; background: #2758a0; }
    .nebula.two { width: 35vw; height: 30vw; right: -7vw; top: -10vw; background: #7661ce; }
    .nebula.three { width: 25vw; height: 20vw; left: 38vw; top: 45vh; background: #a86a95; opacity: .07; }

    #scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
    }

    /* The route is deliberately part of the sky, never placed inside a card. */
    #route {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    .route-shadow { display: none; }
    .route-line {
      fill: none;
      stroke: rgba(232, 222, 186, .48);
      stroke-width: 1.15;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .traveling-heart {
      fill: var(--gold-bright);
      filter: drop-shadow(0 0 7px var(--gold));
      opacity: .95;
    }

    #planetary-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .planet-wrap {
      position: absolute;
      pointer-events: auto;
      transition: transform 1.2s var(--ease);
      user-select: none;
    }

    .planet-wrap.earth {
      left: clamp(2.4rem, 8vw, 9rem);
      bottom: clamp(2.7rem, 8vh, 6rem);
      width: clamp(100px, 15vw, 188px);
      height: clamp(100px, 15vw, 188px);
    }

    .planet-wrap.moon {
      right: clamp(2.8rem, 9vw, 10rem);
      top: clamp(2.8rem, 9vh, 6.5rem);
      width: clamp(82px, 12vw, 150px);
      height: clamp(82px, 12vw, 150px);
    }

    .earth-orb, .moon-orb {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 1.2s var(--ease), filter 1.2s var(--ease);
    }

    .earth-orb {
      overflow: hidden;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.7) 0 1.2%, transparent 1.7%),
        radial-gradient(ellipse at 44% 31%, #61d2c2 0 8%, transparent 9%),
        radial-gradient(ellipse at 62% 48%, #5db4d2 0 14%, transparent 15%),
        radial-gradient(ellipse at 27% 68%, #5caf8a 0 13%, transparent 14%),
        radial-gradient(ellipse at 73% 74%, #76c19b 0 8%, transparent 9%),
        linear-gradient(145deg, #4caed1 0%, #184b93 44%, #071744 100%);
      box-shadow: inset -20px -20px 30px rgba(0,0,0,.55), inset 13px 10px 24px rgba(255,255,255,.2), 0 0 35px rgba(88, 185, 255, .25), 0 0 105px rgba(49, 94, 190, .22);
      animation: earthDrift 9s ease-in-out infinite;
    }

    .earth-orb::before {
      content: '';
      position: absolute;
      inset: 8% 5% 48% 7%;
      border-radius: 48% 52% 40% 42%;
      background: rgba(255,255,255,.13);
      filter: blur(5px);
      transform: rotate(-18deg);
    }

    .earth-orb::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(105deg, rgba(255,255,255,.28), transparent 29%, transparent 67%, rgba(0,0,0,.24));
      mix-blend-mode: screen;
    }

    @keyframes earthDrift { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }

    .moon-orb {
      background:
        radial-gradient(circle at 28% 26%, rgba(255,255,255,.8) 0 2%, transparent 2.5%),
        radial-gradient(circle at 63% 25%, rgba(63,65,89,.2) 0 7%, transparent 7.5%),
        radial-gradient(circle at 38% 63%, rgba(62,64,83,.22) 0 11%, transparent 11.5%),
        radial-gradient(circle at 72% 68%, rgba(65,64,82,.19) 0 8%, transparent 8.5%),
        radial-gradient(circle at 24% 77%, rgba(69,68,83,.16) 0 5%, transparent 5.5%),
        linear-gradient(145deg, #f8f4e8 0%, #b7bdcb 58%, #757b8e 100%);
      box-shadow: inset -14px -13px 22px rgba(30, 35, 54, .37), inset 11px 9px 18px rgba(255,255,255,.45), 0 0 30px rgba(232, 237, 255, .42), 0 0 90px rgba(166, 180, 231, .2);
      animation: moonDrift 8s ease-in-out infinite;
    }

    @keyframes moonDrift { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(3deg); } }

    /* Immersive copy, floating in the sky */
    #story {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 4rem 10vw 6rem;
      text-align: center;
    }

    .story-panel {
      max-width: min(760px, 75vw);
      transform: translateY(0);
      transition: opacity .7s var(--ease), transform .7s var(--ease);
      text-shadow: 0 2px 24px rgba(0,0,0,.7), 0 0 8px rgba(0,0,0,.35);
    }

    .story-panel.leaving { opacity: 0; transform: translateY(22px); }
    .eyebrow {
      color: var(--gold);
      font-size: .7rem;
      letter-spacing: .42em;
      text-transform: uppercase;
      margin-bottom: 1.35rem;
      font-weight: 600;
    }

    h1, h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      color: #f8f5ef;
      line-height: .96;
      margin: 0;
    }

    h1 { font-size: clamp(3.8rem, 9vw, 8.5rem); letter-spacing: -.045em; }
    h2 { font-size: clamp(3rem, 6vw, 6.2rem); letter-spacing: -.035em; }

    .story-text {
      max-width: 630px;
      margin: 1.8rem auto 0;
      font-size: clamp(1rem, 1.7vw, 1.28rem);
      line-height: 1.85;
      color: rgba(226, 232, 240, .82);
      font-weight: 300;
    }

    .gold { color: var(--gold-bright); }
    .quote { color: #fff9e6; font-family: 'Cormorant Garamond', serif; font-size: clamp(1.35rem, 2.3vw, 1.9rem); font-style: italic; }
    .bella-rhyme { margin-top: 1.6rem; color: rgba(255, 244, 202, .93); font-family: 'Cormorant Garamond', serif; font-size: clamp(1.35rem, 2.6vw, 2rem); line-height: 1.25; }

    .chapter-number {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1rem;
      color: rgba(226, 232, 240, .5);
      font-size: .72rem;
      letter-spacing: .25em;
      text-transform: uppercase;
    }
    .chapter-number::before, .chapter-number::after { content: ''; width: 28px; height: 1px; background: rgba(226,232,240,.28); }

    /* Controls */
    #controls {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: clamp(1.5rem, 5vh, 3.6rem);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1.2rem;
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: 1px solid rgba(246,216,139,.52);
      background: rgba(7, 10, 25, .28);
      color: #fff6d5;
      backdrop-filter: blur(8px);
      border-radius: 100px;
      padding: .85rem 1.35rem;
      font: 600 .72rem 'Manrope', sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .3s ease, border-color .3s ease, transform .3s var(--ease), color .3s ease;
      white-space: nowrap;
    }
    button:hover { background: rgba(246,216,139,.14); border-color: var(--gold-bright); transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(.97); }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    #backBtn { opacity: .5; border-color: rgba(226,232,240,.24); color: var(--soft); }
    #backBtn:hover { opacity: 1; }

    #progress {
      position: absolute;
      z-index: 8;
      right: clamp(1.4rem, 4vw, 3.5rem);
      bottom: clamp(1.7rem, 5vh, 3.8rem);
      display: flex;
      gap: .45rem;
      align-items: center;
    }
    .progress-dot { width: 6px; height: 6px; background: rgba(226,232,240,.3); border-radius: 99px; transition: width .4s, background .4s; }
    .progress-dot.active { width: 27px; background: var(--gold); }

    #hint {
      position: absolute;
      left: clamp(1.4rem, 4vw, 3.5rem);
      bottom: clamp(1.7rem, 5vh, 3.8rem);
      z-index: 8;
      color: rgba(226,232,240,.48);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: opacity .5s;
    }

    .pulse-heart {
      display: inline-block;
      color: var(--gold);
      animation: heartbeat 1.2s infinite;
      transform-origin: center;
    }
    @keyframes heartbeat { 0%, 25%, 100% { transform: scale(1); } 10% { transform: scale(1.23); } 18% { transform: scale(1.08); } }

    /* Modal-like final glow, still no box */
    #final-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.4s;
      background: radial-gradient(circle at 50% 50%, rgba(247,216,139,.16), transparent 42%);
    }
    #final-glow.visible { opacity: 1; }

    @media (max-width: 700px) {
      #scene { min-height: 620px; }
      #story { padding: 3rem 1.2rem 8rem; place-items: center; }
      .story-panel { max-width: 92vw; }
      .story-text { line-height: 1.65; margin-top: 1.3rem; }
      .journey-label { display: none; }
      .planet-wrap.earth { left: 1.5rem; bottom: 5rem; }
      .planet-wrap.moon { right: 1.5rem; top: 4.3rem; }
      #controls { bottom: 1.4rem; gap: .5rem; }
      #controls button { padding: .74rem .82rem; letter-spacing: .1em; font-size: .61rem; }
      #progress { bottom: 5.25rem; }
      #progress { right: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="sky" aria-hidden="true">
    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>
  </div>

  <div id="final-glow" aria-hidden="true"></div>

  <main id="scene" aria-label="An immersive journey from Earth to the Moon and back">
    <svg id="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="route-line" d="M 10 84 C 24 55, 56 32, 90 13" />
      <circle class="traveling-heart" r=".55">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M 10 84 C 24 55, 56 32, 90 13" />
      </circle>
    </svg>

    <div id="planetary-stage" aria-hidden="true">
      <div class="planet-wrap earth">
        <div class="earth-orb"></div>
      </div>
      <div class="planet-wrap moon">
        <div class="moon-orb"></div>
      </div>
    </div>

    <section id="story" aria-live="polite">
      <div class="story-panel" id="storyPanel">
        <div class="eyebrow">A simple promise</div>
        <h1>I love you<br /><span class="gold">to the moon</span><br />and back.</h1>
        <p class="story-text">Let's explain.</p>
      </div>
    </section>

    <nav id="controls" aria-label="Journey controls">
      <button id="backBtn" type="button" aria-label="Go back one chapter">← Back</button>
      <button id="nextBtn" type="button">Begin the journey →</button>
    </nav>

    <div id="progress" aria-label="Journey progress">
      <span class="progress-dot active"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
    </div>
  </main>

  <script>
    const sky = document.getElementById('sky');
    const storyPanel = document.getElementById('storyPanel');
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const progressDots = [...document.querySelectorAll('.progress-dot')];
    const finalGlow = document.getElementById('final-glow');
    const moon = document.querySelector('.planet-wrap.moon');
    const earth = document.querySelector('.planet-wrap.earth');

    const stories = [
      {
        eyebrow: 'A simple promise',
        title: 'I love you<br /><span class="gold">to the moon</span><br />and back.',
        text: 'This is not just a sentence. It is a journey.',
        rhyme: '',
        button: 'How much? →'
      },
      {
        eyebrow: '01 · The Science',
        title: 'The power of<br />my heart.',
        text: 'My heart pumps 7,500 liters of blood every day. In my whole life, that is enough blood to fill a car with gas and drive from Earth to the Moon and back!',
        rhyme: '',
        button: 'What it means →'
      },
      {
        eyebrow: '02 · The Meaning',
        title: 'I love you<br />for my whole life.',
        text: 'That is why I say: I love you to the moon and back. It means every beat of my heart is for you, from the start to the end.',
        rhyme: '',
        button: 'A poem for you →'
      },
      {
        eyebrow: '03 · For Bella',
        title: 'My sweet<br />Angel.',
        text: '',
        rhyme: 'Bella, my Angel, look at the Moon,<br />I want to be with you very soon.<br />I am your Bear, and your little Nazi,<br />With you, my life is always easy.',
        button: 'Start again ↺'
      }
    ];

    function createStars() {
      const fragment = document.createDocumentFragment();
      const colors = ['#ffffff', '#c8d7ff', '#ffe8aa', '#d8caff'];
      for (let i = 0; i < 180; i += 1) {
        const star = document.createElement('span');
        star.className = 'star';
        star.style.setProperty('--x', `${Math.random() * 100}%`);
        star.style.setProperty('--y', `${Math.random() * 100}%`);
        star.style.setProperty('--size', `${(Math.random() * 2.4 + .45).toFixed(2)}px`);
        star.style.setProperty('--opacity', (Math.random() * .55 + .16).toFixed(2));
        star.style.setProperty('--duration', `${(Math.random() * 4 + 2).toFixed(2)}s`);
        star.style.setProperty('--delay', `${(-Math.random() * 5).toFixed(2)}s`);
        star.style.setProperty('--star-color', colors[Math.floor(Math.random() * colors.length)]);
        fragment.appendChild(star);
      }
      sky.appendChild(fragment);
    }

    createStars();

    let chapter = 0;
    let transitioning = false;

    function renderChapter(index, direction = 1) {
      if (transitioning || index === chapter) return;
      transitioning = true;
      storyPanel.classList.add('leaving');

      setTimeout(() => {
        const story = stories[index];
        storyPanel.innerHTML = `
          <div class="eyebrow">${story.eyebrow}</div>
          <h2>${story.title}</h2>
          ${story.text ? `<p class="story-text">${story.text}</p>` : ''}
          <p class="bella-rhyme">${story.rhyme}</p>
        `;
        storyPanel.classList.remove('leaving');
        chapter = index;
        transitioning = false;
        updateControls();
        movePlanets(index, direction);
      }, 450);
    }

    function updateControls() {
      progressDots.forEach((dot, i) => dot.classList.toggle('active', i === chapter));
      backBtn.style.visibility = chapter === 0 ? 'hidden' : 'visible';
      nextBtn.textContent = stories[chapter].button;
      finalGlow.classList.toggle('visible', chapter === stories.length - 1);
    }

    function movePlanets(index, direction) {
      if (index === 1) {
        earth.style.transform = 'scale(1.05)';
        moon.style.transform = 'scale(1.05)';
      } else if (index === 2) {
        earth.style.transform = 'scale(.93)';
        moon.style.transform = 'scale(1.08)';
      } else if (index === 3) {
        earth.style.transform = 'scale(1.12)';
        moon.style.transform = 'scale(1.12)';
      } else {
        earth.style.transform = 'scale(1)';
        moon.style.transform = 'scale(1)';
      }
    }

    nextBtn.addEventListener('click', () => {
      if (chapter < stories.length - 1) {
        renderChapter(chapter + 1, 1);
      } else {
        celebrate();
      }
    });

    backBtn.addEventListener('click', () => {
      if (chapter > 0) renderChapter(chapter - 1, -1);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === ' ') {
        event.preventDefault();
        nextBtn.click();
      }
      if (event.key === 'ArrowLeft') backBtn.click();
    });

    function celebrate() {
      nextBtn.textContent = 'Again from the beginning ↺';
      nextBtn.onclick = () => {
        nextBtn.onclick = null;
        chapter = 0;
        storyPanel.innerHTML = `
          <div class="eyebrow">A simple promise</div>
          <h1>I love you<br /><span class="gold">to the moon</span><br />and back.</h1>
          <p class="story-text">This is not just a sentence. It is a journey.</p>
        `;
        updateControls();
        finalGlow.classList.remove('visible');
      };

      for (let i = 0; i < 36; i += 1) {
        setTimeout(() => {
          const particle = document.createElement('span');
          particle.className = 'floating-star';
          particle.textContent = ['✦', '✧', '♥', '🌙', '⋆'][Math.floor(Math.random() * 5)];
          particle.style.left = `${Math.random() * 100}vw`;
          particle.style.top = `${85 + Math.random() * 15}vh`;
          particle.style.color = Math.random() > .45 ? '#f6d88b' : '#dbe8ff';
          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 3100);
        }, i * 55);
      }
    }

    // A restrained parallax effect keeps the sky feeling spacious without distracting from the story.
    let raf = null;
    window.addEventListener('pointermove', (event) => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const x = (event.clientX / window.innerWidth - .5) * 2;
        const y = (event.clientY / window.innerHeight - .5) * 2;
        document.querySelector('.nebula.two').style.transform = `translate(${x * 10}px, ${y * 8}px)`;
        document.querySelector('.nebula.one').style.transform = `translate(${-x * 8}px, ${-y * 5}px)`;
        earth.style.marginLeft = `${x * 2}px`;
        moon.style.marginTop = `${y * 2}px`;
      });
    });

    updateControls();
  </script>
</body>
</html>
